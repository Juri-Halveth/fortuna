<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">FORTUNA · lokales Wahrscheinlichkeitslabor</title>
  <desc id="desc">Projektgrafik mit zwei schematischen Serien für eine ein- und eine fünfprozentige Modellchance. Sie zeigt keine gemessenen Ergebnisse.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#081713"/>
      <stop offset=".56" stop-color="#122923"/>
      <stop offset="1" stop-color="#172a37"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#e5d17d"/>
      <stop offset="1" stop-color="#86dfbd"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#b7d1be" stroke-opacity=".055"/>
    </pattern>
    <pattern id="samples" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#7a988e" fill-opacity=".5"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="21" fill="url(#space)"/>
  <rect width="1200" height="300" rx="21" fill="url(#grid)"/>
  <path d="M0 0h7v300H0" fill="url(#accent)"/>
  <circle cx="94" cy="83" r="31" fill="#172b27" stroke="#e5d17d" stroke-width="2"/>
