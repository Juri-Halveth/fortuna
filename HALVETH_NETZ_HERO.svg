  <rect x="660" y="83" width="204" height="169" rx="12" fill="#1c3430" stroke="#536e63"/>
  <rect x="890" y="83" width="204" height="169" rx="12" fill="#1c3430" stroke="#536e63"/>
  <text x="675" y="109" fill="#e5d17d" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">AUSGANG · p = 1 %</text>
  <text x="905" y="109" fill="#86dfbd" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">SZENARIO · p = 5 %</text>
  <rect x="681" y="120" width="120" height="120" fill="url(#samples)"/>
  <rect x="911" y="120" width="120" height="120" fill="url(#samples)"/>
