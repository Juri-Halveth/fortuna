  <text x="141" y="76" fill="#e5d17d" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">LOKALES WAHRSCHEINLICHKEITSLABOR</text>
  <text x="65" y="169" fill="#f1f8ef" font-family="Segoe UI,Arial,sans-serif" font-size="68" font-weight="750">FORTUNA</text>
  <text x="67" y="211" fill="#c0d5ca" font-family="Segoe UI,Arial,sans-serif" font-size="23">Chance setzen · Serien ziehen · Treffer prüfen</text>
  <path d="M67 239h445" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="67" y="269" fill="#8fb5a8" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1">EIGENES MODELL · BIS 999.999 ZIEHUNGEN JE SERIE</text>
  <path d="M618 42v217" stroke="#9bc4ae" stroke-opacity=".25"/>
